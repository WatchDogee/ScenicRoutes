<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">
    <title>ScenicRoutes</title>
    
    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://fonts.bunny.net">
    <link href="https://fonts.bunny.net/css?family=figtree:400,500,600&display=swap" rel="stylesheet" />
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: 'Figtree', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
        }
        
        #app {
            width: 100%;
            height: 100%;
            position: relative;
        }
        
        /* Loading screen */
        .app-loading {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ffffff;
            z-index: 9999;
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="app-loading">
            <div style="text-align: center;">
                <div style="font-size: 24px; margin-bottom: 16px;">🗺️</div>
                <div style="color: #666;">Loading ScenicRoutes...</div>
            </div>
        </div>
    </div>
    
    <!-- Load mobile.jsx bundle from manifest -->
    <script>
        console.log('Starting app initialization...');
        
        // Global function for React to call when ready
        window.hideLoadingScreen = function() {
            console.log('Hiding loading screen...');
            const loading = document.querySelector('.app-loading');
            if (loading) {
                loading.style.display = 'none';
                console.log('Loading screen hidden');
            }
        };
        
        // Load the correct script from manifest
        (async function() {
            try {
                console.log('Fetching manifest...');
                const manifestResponse = await fetch('/build/manifest.json');
                if (!manifestResponse.ok) {
                    throw new Error(`Manifest fetch failed: ${manifestResponse.status}`);
                }
                const manifest = await manifestResponse.json();
                console.log('Manifest loaded:', manifest);
                
                const mobileEntry = manifest['resources/js/mobile.jsx'];
                console.log('Mobile entry:', mobileEntry);
                
                if (mobileEntry && mobileEntry.file) {
                    const scriptPath = `/build/${mobileEntry.file}`;
                    console.log('Loading script:', scriptPath);
                    
                    const script = document.createElement('script');
                    script.type = 'module';
                    script.src = scriptPath;
                    
                    script.onerror = function(error) {
                        console.error('Script load error:', error);
                        showError('Failed to load application script. Check console for details.');
                    };
                    
                    script.onload = function() {
                        console.log('Script loaded successfully');
                        // React should call window.hideLoadingScreen() when ready
                        // But we'll also set a fallback timeout
                        setTimeout(() => {
                            const loading = document.querySelector('.app-loading');
                            if (loading && loading.style.display !== 'none') {
                                console.warn('Loading screen still visible - React may not have rendered');
                                // Try to hide it anyway
                                window.hideLoadingScreen();
                            }
                        }, 3000);
                    };
                    
                    document.head.appendChild(script);
                } else {
                    throw new Error('Mobile entry not found in manifest');
                }
            } catch (error) {
                console.error('Error loading manifest:', error);
                showError(`Failed to load application: ${error.message}`);
            }
        })();
        
        function showError(message) {
            console.error('Showing error:', message);
            const loading = document.querySelector('.app-loading');
            if (loading) {
                loading.innerHTML = `
                    <div style="text-align: center; color: #dc2626; padding: 20px;">
                        <div style="font-size: 24px; margin-bottom: 16px;">⚠️</div>
                        <div style="margin-bottom: 8px; font-weight: bold;">${message}</div>
                        <div style="font-size: 12px; color: #666; margin-bottom: 16px;">Check console for details</div>
                        <button onclick="window.location.reload()" style="padding: 8px 16px; background: #2563eb; color: white; border: none; border-radius: 4px; cursor: pointer;">
                            Reload
                        </button>
                    </div>
                `;
            }
        }
        
        // Global error handler
        window.addEventListener('error', function(event) {
            console.error('Global error:', event.error);
            showError(`JavaScript error: ${event.error?.message || 'Unknown error'}`);
        });
        
        window.addEventListener('unhandledrejection', function(event) {
            console.error('Unhandled promise rejection:', event.reason);
            showError(`Promise error: ${event.reason?.message || 'Unknown error'}`);
        });
        
        // Fallback: Hide loading screen after long timeout
        setTimeout(() => {
            const loading = document.querySelector('.app-loading');
            if (loading && loading.style.display !== 'none') {
                console.warn('Loading screen still visible after 15 seconds - forcing hide');
                window.hideLoadingScreen();
            }
        }, 15000);
    </script>
</body>
</html>
